# VyomaOS boot configuration
#
# Layer order (z-index): desktop(0) < apps(10) < dock(100) < menu-bar(200)
#
# Auto-started on boot:
#   desktop       — wallpaper + app launcher grid (z=0, permanent background)
#   dock          — always-visible launcher strip  (z=100, permanent foreground)
#   clock         — menu bar clock (z=10)
#
# On-demand (launched from desktop/dock/spotlight):
#   shell, notes, system-monitor, settings, spotlight, and all other apps

[[apps]]
manifest = "/apps/desktop/vyoma.toml"
restart  = "always"

[[apps]]
manifest = "/apps/dock/vyoma.toml"
restart  = "always"

[[apps]]
manifest = "/apps/clock/vyoma.toml"
restart  = "always"
