# VyomaOS boot configuration
# Minimal startup: desktop + dock + background HTTP server.
# All other apps are launched on-demand via the desktop icon grid.

[[apps]]
manifest = "/apps/desktop/vyoma.toml"
restart  = "always"

[[apps]]
manifest = "/apps/dock/vyoma.toml"
restart  = "always"

[[apps]]
manifest = "/apps/http-server/vyoma.toml"
restart  = "always"
