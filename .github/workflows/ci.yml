name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Supervisor unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('docker/Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build builder image
        run: make image

      - name: Run supervisor unit tests
        run: make unit-test

  manifest-check:
    name: Manifest validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build builder image
        run: make image

      - name: Validate app manifests
        run: make check-manifests

  smoke-test:
    name: Smoke test (headless boot)
    runs-on: ubuntu-latest
    needs: [unit-tests, manifest-check]

    steps:
      - uses: actions/checkout@v4

      - name: Build builder image
        run: make image

      - name: Full build
        run: make build

      - name: Smoke test
        run: make smoke
