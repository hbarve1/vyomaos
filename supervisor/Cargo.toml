[package]
name    = "supervisor"
version = "0.1.0"
edition = "2021"

[lib]
name = "supervisor"
path = "src/lib.rs"

[[bin]]
name = "supervisor"
path = "src/main.rs"

[dependencies]
libc  = { version = "0.2", default-features = false }
serde = { version = "1", features = ["derive"] }
sha2  = { version = "0.10", default-features = false }
toml  = "0.8"

[features]
# Enable when the wasm3 Rust crate is available for the build target.
# Currently disabled — the mock adapter in src/runtime/wasm3.rs is used instead.
wasm3 = []

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level     = "z"      # optimise for binary size
lto           = true     # link-time optimisation
codegen-units = 1        # single CGU improves LTO effectiveness
strip         = true     # strip debug symbols
panic         = "abort"  # no unwinding (~50 KB saving in musl builds)
