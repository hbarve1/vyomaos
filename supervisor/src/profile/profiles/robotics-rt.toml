[platform]
name = "robotics-rt"
arch = "arm64"
runtime = "wamr"
min_ram_kb = 8192

[supervisor]
modules = ["lifecycle", "capability", "ipc", "hal", "observability", "net"]

[hal]
drivers = ["gpio", "i2c", "spi", "uart", "adc"]

[boot]
apps = []

[observability]
tier = "baseline"
heartbeat_interval_s = 10

[ota]
enabled = true
health_check_secs = 30
ab_slots = true

[build]
kernel_config = "kernel.config"
rootfs_script = "rootfs.sh"
