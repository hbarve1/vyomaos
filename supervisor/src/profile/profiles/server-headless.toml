[platform]
name = "server-headless"
arch = "x86-64"
runtime = "wasmtime"
min_ram_kb = 1048576

[supervisor]
modules = ["lifecycle", "capability", "ipc", "net", "packages", "observability"]

[hal]
drivers = []

[boot]
apps = []

[observability]
tier = "full"
heartbeat_interval_s = 30

[ota]
enabled = true
health_check_secs = 60
ab_slots = true

[build]
kernel_config = "kernel.config"
rootfs_script = "rootfs.sh"
