[package]
name    = "vyoma"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vyoma"
path = "src/main.rs"

[dependencies]
clap       = { version = "4", features = ["derive", "cargo", "env"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm  = "0.27"
indicatif  = "0.17"
anyhow     = "1"
