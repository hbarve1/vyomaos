[package]
name    = "vyoma"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vyoma"
path = "src/main.rs"

[dependencies]
clap       = { version = "4", features = ["derive", "cargo"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm  = "0.27"
indicatif  = "0.17"
anyhow     = "1"

[profile.release]
lto           = true
strip         = true
opt-level     = "z"
codegen-units = 1
panic         = "abort"
