[app]
name    = "text-editor"
version = "0.1.0"
wasm    = "text-editor.wasm"

[capabilities]
stdio      = true
filesystem = true
network    = false
display    = true
shell      = true   # receives keyboard focus when launched via `run text-editor`
mouse      = false

[window]
x = 0
y = 0
w = 1440
h = 900
